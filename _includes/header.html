<header class="site-header">
  <a class="logo" href="{{ '/' | relative_url }}">A Brain<span class="badge">LOG</span> by Pratul</a>
  <nav class="site-nav">
    {% for item in site.nav %}
      {%- assign url_prefix = page.url | slice: 0, item.url.size -%}
      <a href="{{ item.url | relative_url }}"{% if url_prefix == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
